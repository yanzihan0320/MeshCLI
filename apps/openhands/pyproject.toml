[project]
name = "meshcli-openhands-runtime"
version = "0.1.0"
description = "OpenHands execution runtime used by the MeshCLI Agent Gateway."
requires-python = ">=3.12,<3.13"
dependencies = [
    "openhands-sdk==1.36.1",
    "openhands-tools==1.36.1",
    "openhands-workspace==1.36.1",
    "openhands-agent-server==1.36.1",
    "python-dotenv>=1.1.0,<2",
]

[dependency-groups]
dev = ["pytest>=8.4,<9"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["meshcli_openhands"]
